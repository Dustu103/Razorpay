version: '3.9'

services:

  # ── Infrastructure ────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: razorpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: razorpay
      POSTGRES_PASSWORD: razorpay
      POSTGRES_DB: razorpay_classifier
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorpay -d razorpay_classifier"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: razorpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend Services ──────────────────────────────────────────────────

  ingestion-service:
    build:
      context: ./backend/ingestion-service
      dockerfile: Dockerfile
    container_name: razorpay-ingestion
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://razorpay:razorpay@postgres:5432/razorpay_classifier?sslmode=disable
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: classification_jobs
      INGESTION_PORT: "3001"
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  inference-service:
    build:
      context: ./backend/inference-service
      dockerfile: Dockerfile
    container_name: razorpay-inference
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CHARGEBACK_MODEL_DIR: /app/models/chargeback
    volumes:
      - ./models/ml:/app/models/ml
      - ./models/chargeback:/app/models/chargeback
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  classification-service:
    build:
      context: ./backend/classification-service
      dockerfile: Dockerfile
    container_name: razorpay-classification
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://razorpay:razorpay@postgres:5432/razorpay_classifier?sslmode=disable
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: classification_jobs
      APP_ENV: development
      ML_SERVICE_URL: http://inference-service:8000
      # Layer 3 LLM — free Groq key. Get one at https://console.groq.com
      # Leave empty to run in heuristic-fallback mode (pipeline still works)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      inference-service:
        condition: service_healthy

  b2b-recovery-service:
    build:
      context: ./backend/b2b-recovery-service
      dockerfile: Dockerfile
    container_name: razorpay-b2b-recovery
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      DATABASE_URL: postgres://razorpay:razorpay@postgres:5432/razorpay_classifier?sslmode=disable
      AGENT_SERVICE_URL: http://inference-service:8000/agent/b2b-invoice
      PORT: "3006"
    depends_on:
      postgres:
        condition: service_healthy
      inference-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: razorpay-audit
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgres://razorpay:razorpay@postgres:5432/razorpay_classifier?sslmode=disable
      AUDIT_PORT: "3003"
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  compliance-service:
    build:
      context: ./backend/compliance-service
      dockerfile: Dockerfile
    container_name: razorpay-compliance
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3004/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  chargeback-service:
    build:
      context: ./backend/chargeback-service
      dockerfile: Dockerfile
    container_name: razorpay-chargeback
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INFERENCE_SERVICE_URL: http://inference-service:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3005/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  bnpl-edge-service:
    build:
      context: ./backend/bnpl-edge-service
      dockerfile: Dockerfile
    container_name: razorpay-bnpl-edge
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      ML_SERVICE_URL: http://inference-service:8000
      PORT: "8003"
    depends_on:
      inference-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ──────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: razorpay-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUDIT_SERVICE_URL: http://audit-service:3003
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    depends_on:
      audit-service:
        condition: service_healthy

volumes:
  postgres-data:
